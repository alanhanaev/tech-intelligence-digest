access_policy:
  preferred_order:
    - api
    - rss_atom
    - github_releases
    - changelog
    - direct
    - sitemap
    - search
    - browserless
    - secondary_or_skip

  browserless:
    role: last_mile_fallback
    known_candidates:
      - DeepSeek changelog/pages when direct extraction fails
      - Qwen dynamic pages if search/direct is incomplete
      - Sourcegraph index pages if direct extraction fails
      - Karat research index if direct extraction fails
      - Pinecone pages if direct parser fails
      - Eurostat dynamic pages if API/direct options fail
